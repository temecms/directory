name: Check listings

# Runs the directory's checks on the listings a pull request adds or changes.
# The pull request's files are only read: the tools come from the base branch,
# and a package's own code runs only in the install jobs, which hold no secrets
# and can write nothing. The results are posted by the Comment on checks
# workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: check-listings-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      installs: ${{ steps.inspect.outputs.installs }}
    steps:
      - name: Check out the tools from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          persist-credentials: false

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, sodium, zip
          coverage: none

      - name: Install the tools
        working-directory: tool
        run: composer install --no-interaction --no-progress --no-dev

      - name: Inspect the changed listings
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          git -C pr diff --name-status HEAD^1 HEAD > changed.txt
          php tool/bin/directory pr-inspect --pr pr --changed changed.txt --association "$ASSOCIATION" --out inspection
          echo "installs=$(cat inspection/installs.json)" >> "$GITHUB_OUTPUT"
          echo "${{ github.event.pull_request.number }}" > inspection/number

      - uses: actions/upload-artifact@v4
        with:
          name: inspection
          path: inspection
          retention-days: 7

  install:
    needs: inspect
    if: needs.inspect.outputs.installs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.inspect.outputs.installs) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: teme
          POSTGRES_PASSWORD: teme
          POSTGRES_DB: teme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: teme
      DB_USERNAME: teme
      DB_PASSWORD: teme
    steps:
      - name: Check out the tools from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: inspection
          path: inspection

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, intl, pdo_pgsql, pgsql, sodium, zip, gd, bcmath, exif
          coverage: none

      - name: Install on Teme ${{ matrix.teme }}
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          KIND: ${{ matrix.kind }}
          CODE: ${{ matrix.code }}
          TEME: ${{ matrix.teme }}
          ARCHIVE: ${{ matrix.archive }}
          TESTS: ${{ matrix.tests }}
        run: |
          result="results/$(echo "$NAME-$VERSION-$TEME" | tr '/' '-').json"
          tool/scripts/install-check "inspection/archives/$ARCHIVE" "$NAME" "$VERSION" "$KIND" "$CODE" "$TEME" "$result" "$TESTS" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: results
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [inspect, install]
    if: always() && needs.inspect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tools from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tool
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, sodium, zip
          coverage: none

      - name: Install the tools
        working-directory: tool
        run: composer install --no-interaction --no-progress --no-dev

      - uses: actions/download-artifact@v4
        with:
          name: inspection
          path: inspection

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Write the comment
        id: report
        run: |
          mkdir -p comment results
          cp inspection/number comment/number
          php tool/bin/directory pr-report --report inspection/report.json --results results --out comment/comment.md && echo "passed=true" >> "$GITHUB_OUTPUT" || echo "passed=false" >> "$GITHUB_OUTPUT"
          cat comment/comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: comment
          path: comment
          retention-days: 7

      - name: Fail when a check needs attention
        if: steps.report.outputs.passed != 'true'
        run: exit 1

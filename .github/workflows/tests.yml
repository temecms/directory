name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, sodium, zip
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Test the index builder, the signer and the checks
        run: vendor/bin/phpunit

      - name: Check every listing
        run: php bin/directory validate

      - name: Check the scripts
        run: |
          bash -n scripts/install-check
          php -l scripts/make-signing-key
